name: Tests and repository secret check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
      DO_NOT_TRACK: "1"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies (setup network access)
        run: |
          python -m pip install uv==0.13.0
          uv venv --python "$(command -v python)" .venv
          uv pip sync --python .venv/bin/python requirements.lock
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e .
      - name: Test synthetic sources and mocked models
        run: .venv/bin/pytest -q
      - name: Install Gitleaks (setup network access)
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install gitleaks
          fi
      - name: Check repository secrets (synthetic fixture explicitly allowlisted)
        run: gitleaks git . --config .gitleaks.toml --redact=100 --no-banner
