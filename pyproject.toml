[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "mobile-audit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]
[project.scripts]
mobile-audit = "mobile_audit.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/mobile_audit"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
